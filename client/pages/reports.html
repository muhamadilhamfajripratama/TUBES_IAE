<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Analytics - HRRS</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fa-solid fa-layer-group"></i></div>
            <h2>HRRS<span class="dot">.</span></h2>
        </div>
        <ul class="menu">
            <li onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-chart-pie"></i> Dashboard</li>
            <li onclick="window.location.href='users.html'"><i class="fa-solid fa-users"></i> Users Management</li>
            <li onclick="window.location.href='vacancies.html'"><i class="fa-solid fa-briefcase"></i> Vacancies</li>
            <li onclick="window.location.href='applicants.html'"><i class="fa-solid fa-file-signature"></i> Applicants</li>
            <li onclick="window.location.href='interviews.html'"><i class="fa-solid fa-comments"></i> Interviews</li>
            <li class="active"><i class="fa-solid fa-chart-line"></i> Reports</li>
            <li><i class="fa-solid fa-gear"></i> Settings</li>
            <li onclick="handleLogout()" style="margin-top: 50px; color: #ef4444; cursor: pointer;"><i class="fa-solid fa-right-from-bracket"></i> Logout</li>
        </ul>
        <div class="sidebar-footer">
            <div class="system-status"><div class="indicator online"></div><span>System Online</span></div>
        </div>
    </nav>

    <main class="content">
        <header class="topbar">
            <div class="search-bar"><i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Search reports..."></div>
            <div class="profile-area" onclick="window.location.href='profile.html'" style="cursor: pointer;">
                <div class="profile">
                    <img src="https://ui-avatars.com/api/?name=HR+Admin&background=0D8ABC&color=fff" alt="Admin">
                    <div class="profile-info"><span class="name">HR Administrator</span><span class="role">Enterprise Admin</span></div>
                </div>
            </div>
        </header>

        <div class="page-header">
            <div>
                <h1 style="font-size: 28px; margin-bottom: 5px;">Recruitment Analytics</h1>
                <p style="color: var(--text-muted); font-size: 15px;">Monitor recruitment trends and hiring performance.</p>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div class="table-container" style="grid-column: span 2;">
                <h3 style="margin-bottom: 20px; color: #1e293b;">Monthly Application Trend</h3>
                <div style="height: 350px;"><canvas id="trendChart"></canvas></div>
            </div>
        </div>
    </main>

    <script src="../js/auth.js"></script>
    <script>
        // Skrip Statis Khusus untuk halaman Report visualisasi
        window.onload = function() {
            new Chart(document.getElementById('trendChart'), {
                type: 'line',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                    datasets: [{ label: 'Applicants', data: [12, 19, 15, 25, 22, 30], borderColor: '#4f46e5', tension: 0.4 }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        };
    </script>
</body>
</html>
