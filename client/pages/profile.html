<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - HRRS</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #e2e8f0;
        }
        .profile-avatar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-blue);
            margin-bottom: 15px;
        }
        .profile-name-title {
            text-align: center;
        }
        .profile-name-title h2 {
            font-size: 22px;
            color: #1e293b;
            margin-bottom: 5px;
        }
        .profile-name-title span {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .btn-danger-outline {
            background: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-danger-outline:hover {
            background: #fef2f2;
        }
    </style>
</head>
<body>
    <!-- Dynamic Sidebar -->
    <nav class="sidebar" id="dynamicSidebar">
        <!-- Will be populated by JS -->
    </nav>

    <main class="content">
        <header class="topbar">
            <div class="search-bar">
                <!-- Empty spacer -->
            </div>
            <div class="profile-area">
                <div class="profile">
                    <img id="topbarAvatar" src="https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff" alt="User">
                    <div class="profile-info">
                        <span class="name" id="topbarName">Loading...</span>
                        <span class="role" id="topbarRole">User</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-header">
            <div>
                <h1 style="font-size: 28px; margin-bottom: 5px;">Profile Settings</h1>
                <p style="color: var(--text-muted); font-size: 15px;">Manage your account details and credentials.</p>
            </div>
        </div>

        <div class="profile-card">
            <div class="profile-avatar-wrapper">
                <img id="profileCardAvatar" src="https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff" alt="User Avatar" class="profile-avatar">
                <div class="profile-name-title">
                    <h2 id="profileCardName">Loading...</h2>
                    <span id="profileCardRole">Role</span>
                </div>
            </div>

            <form id="profileForm" onsubmit="handleUpdateProfile(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="profName" required placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="profEmail" required placeholder="yourname@example.com">
                </div>
                <div class="form-group">
                    <label>New Password (Leave blank to keep current)</label>
                    <input type="password" id="profPassword" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>Account Role</label>
                    <input type="text" id="profRole" readonly disabled style="background: var(--bg-light); cursor: not-allowed;">
                </div>

                <div class="form-actions" id="viewActions">
                    <button type="button" class="btn-primary" style="flex: 1; padding: 12px 20px;" onclick="toggleEditMode(true)">
                        <i class="fa-solid fa-pen"></i> Edit Profile
                    </button>
                    <button type="button" class="btn-danger-outline" onclick="handleDeleteProfile()">
                        <i class="fa-solid fa-trash-can"></i> Delete Account
                    </button>
                </div>
                <div class="form-actions" id="editActions" style="display: none;">
                    <button type="submit" class="btn-primary" style="flex: 1; padding: 12px 20px;">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan Perubahan
                    </button>
                    <button type="button" style="background: #64748b; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s;" onclick="toggleEditMode(false)">
                        <i class="fa-solid fa-xmark"></i> Batal Perubahan
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="../js/auth.js?v=3"></script>
    <script src="../js/profile.js?v=3"></script>
</body>
</html>
