<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interviews - HRRS</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fa-solid fa-layer-group"></i></div>
            <h2>HRRS<span class="dot">.</span></h2>
        </div>
        <ul class="menu">
            <li onclick="window.location.href='pelamar_dashboard.html'"><i class="fa-solid fa-briefcase"></i> Available Vacancies</li>
            <li onclick="window.location.href='pelamar_applications.html'"><i class="fa-solid fa-file-signature"></i> My Applications</li>
            <li class="active" onclick="window.location.href='pelamar_interviews.html'"><i class="fa-solid fa-comments"></i> My Interviews</li>
            <li onclick="handleLogout()" style="margin-top: 50px; color: #ef4444;"><i class="fa-solid fa-right-from-bracket"></i> Logout</li>
        </ul>
        <div class="sidebar-footer">
            <div class="system-status"><div class="indicator online"></div><span>System Online</span></div>
        </div>
    </nav>

    <main class="content">
        <header class="topbar">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search my schedules...">
            </div>
            <div class="profile-area" onclick="window.location.href='profile.html'" style="cursor: pointer;">
                <div class="profile">
                    <img src="https://ui-avatars.com/api/?name=User&background=E2E8F0&color=333" alt="Applicant">
                    <div class="profile-info">
                        <span class="name" id="profileName">Loading...</span> 
                        <span class="role">Applicant</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-header">
            <div>
                <h1 style="font-size: 28px; margin-bottom: 5px;">My Interview Schedules</h1>
                <p style="color: var(--text-muted); font-size: 15px;">View your upcoming interview appointments.</p>
            </div>
        </div>

        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Job Position</th>
                        <th>Date & Time</th>
                        <th>Interviewer</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="myInterviewsBody">
                    </tbody>
            </table>
        </div>
    </main>
    <script src="../js/auth.js"></script>
    <script src="../js/pelamar.js"></script>
</body>
</html>
