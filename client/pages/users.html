<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Management - HRRS</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fa-solid fa-layer-group"></i></div>
            <h2>HRRS<span class="dot">.</span></h2>
        </div>
        <ul class="menu">
            <li onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-chart-pie"></i> Dashboard</li>
            <li class="active"><i class="fa-solid fa-users"></i> Users Management</li>
            <li onclick="window.location.href='vacancies.html'"><i class="fa-solid fa-briefcase"></i> Vacancies</li>
            <li onclick="window.location.href='applicants.html'"><i class="fa-solid fa-file-signature"></i> Applicants</li>
            <li onclick="window.location.href='interviews.html'"><i class="fa-solid fa-comments"></i> Interviews</li>
            <li onclick="window.location.href='reports.html'"><i class="fa-solid fa-chart-line"></i> Reports</li>
            <li><i class="fa-solid fa-gear"></i> Settings</li>
        </ul>
        <div class="sidebar-footer">
            <div class="system-status">
                <div class="indicator online"></div>
                <span>System Online</span>
            </div>
        </div>
    </nav>

    <main class="content">
        <header class="topbar">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search users by name or email...">
            </div>
            <div class="profile-area">
                <div class="profile">
                    <img src="https://ui-avatars.com/api/?name=HR+Admin&background=0D8ABC&color=fff" alt="Admin">
                    <div class="profile-info">
                        <span class="name">HR Administrator</span>
                        <span class="role">Enterprise Admin</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-header">
            <div>
                <h1 style="font-size: 28px; margin-bottom: 5px;">Users Management</h1>
                <p style="color: var(--text-muted); font-size: 15px;">Manage system access, roles, and user accounts.</p>
            </div>
        </div>

        <div class="table-container" style="background: #F8FAFC; border: 1px dashed #CBD5E1; box-shadow: none;">
            <h3 style="margin-bottom: 15px; color: var(--primary-blue); font-size: 16px;"><i class="fa-solid fa-user-plus"></i> Form Mutation: Create User</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 20px; margin-bottom: 15px;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="userName" placeholder="e.g. John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="userEmail" placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="userRole">
                        <option value="HR">HR</option>
                        <option value="Pelamar">Pelamar</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="userPassword" placeholder="••••••••">
                </div>
            </div>
            <button class="btn-primary" style="background: var(--accent-teal); color: white;" onclick="handleCreateUser()">Register User</button>
        </div>

        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    </tbody>
            </table>
        </div>
    </main>

    <script src="../js/user.js"></script> 
</body>
</html>
