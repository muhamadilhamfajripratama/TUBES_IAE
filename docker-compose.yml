version: '3.8'

services:
  # ==========================================
  # 1. USER SERVICE & DATABASE
  # ==========================================
  user-db:
    image: mysql:8.0
    container_name: hrrs_user_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "rootpassword"
      MYSQL_DATABASE: "tubes_user_db"
    ports:
      - "3301:3306"
    volumes:
      - user_db_data:/var/lib/mysql
      - ./user_init.sql:/docker-entrypoint-initdb.d/init.sql

  user-service:
    build: ./user-service
    container_name: hrrs_user_service
    ports:
      - "4001:4001"
    environment:
      - DB_HOST=user-db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=tubes_user_db
    volumes:
      - ./user-service:/app
      - /app/node_modules
    depends_on:
      - user-db
    restart: unless-stopped


  # ==========================================
  # 2. VACANCY SERVICE & DATABASE
  # ==========================================
  vacancy-db:
    image: mysql:8.0
    container_name: hrrs_vacancy_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "rootpassword"
      MYSQL_DATABASE: "tubes_vacancy_db"
    ports:
      - "3302:3306"
    volumes:
      - vacancy_db_data:/var/lib/mysql
      - ./vacancy_init.sql:/docker-entrypoint-initdb.d/init.sql

  vacancy-service:
    build: ./vacancy-service
    container_name: hrrs_vacancy_service
    ports:
      - "4002:4002"
    environment:
      - DB_HOST=vacancy-db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=tubes_vacancy_db
    volumes:
      - ./vacancy-service:/app
      - /app/node_modules
    depends_on:
      - vacancy-db
    restart: unless-stopped


  # ==========================================
  # 3. APPLICANT SERVICE & DATABASE
  # ==========================================
  applicant-db:
    image: mysql:8.0
    container_name: hrrs_applicant_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "rootpassword"
      MYSQL_DATABASE: "tubes_applicant_db"
    ports:
      - "3303:3306"
    volumes:
      - applicant_db_data:/var/lib/mysql
      - ./applicant_init.sql:/docker-entrypoint-initdb.d/init.sql

  applicant-service:
    build: ./applicant-service
    container_name: hrrs_applicant_service
    ports:
      - "4003:4003"
    environment:
      - DB_HOST=applicant-db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=tubes_applicant_db
    volumes:
      - ./applicant-service:/app
      - /app/node_modules
    depends_on:
      - applicant-db
    restart: unless-stopped


  # ==========================================
  # 4. INTERVIEW SERVICE & DATABASE
  # ==========================================
  interview-db:
    image: mysql:8.0
    container_name: hrrs_interview_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "rootpassword"
      MYSQL_DATABASE: "tubes_interview_db"
    ports:
      - "3304:3306"
    volumes:
      - interview_db_data:/var/lib/mysql
      - ./interview_init.sql:/docker-entrypoint-initdb.d/init.sql

  interview-service:
    build: ./interview-service
    container_name: hrrs_interview_service
    ports:
      - "4004:4004"
    environment:
      - DB_HOST=interview-db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=tubes_interview_db
    volumes:
      - ./interview-service:/app
      - /app/node_modules
    depends_on:
      - interview-db
    restart: unless-stopped

  # ==========================================
  # 5. PHPMYADMIN (Untuk melihat isi database)
  # ==========================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: hrrs_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_ARBITRARY: 1

# ==========================================
# VOLUMES DECLARATION
# ==========================================
volumes:
  user_db_data:
  vacancy_db_data:
  applicant_db_data:
  interview_db_data: